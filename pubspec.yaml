name: greengrocer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  animated_text_kit: ^4.2.1
  mask_text_input_formatter: ^2.0.0
  badges: ^2.0.1
  intl: ^0.17.0
  qr_flutter: ^4.0.0
  add_to_cart_animation: ^0.0.7
  fluttertoast: ^8.0.8
  shimmer: ^2.0.0
  firebase_core: ^4.5.0
  get: ^4.7.3
  dio: ^5.9.2
  json_annotation: ^4.11.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.13.1
  build_runner: ^2.13.1
  
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fruits/
    # - assets/fruits/apple.png
    # - assets/fruits/grape.png
    # - assets/fruits/guava.png
    # - assets/fruits/kiwi.png
    # - assets/fruits/mango.png
    # - assets/fruits/papaya.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_images/app_icon.png"
  remove_alpha_ios: true
